name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Import Developer ID certificate
        id: signing
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CERTIFICATE_BASE64" ]]; then
            echo "Developer ID certificate secret is required for a public release." >&2
            exit 1
          fi
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo -n "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)
          [[ -n "$IDENTITY" ]]
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Store notarization credentials
        env:
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          if [[ -z "$NOTARY_KEY_BASE64" || -z "$NOTARY_KEY_ID" || -z "$NOTARY_ISSUER" ]]; then
            echo "Apple notarization secrets are required for a public release." >&2
            exit 1
          fi
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo -n "$NOTARY_KEY_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          xcrun notarytool store-credentials sibdocks-notary \
            --key "$NOTARY_KEY_PATH" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"

      - name: Build, notarize, and archive
        env:
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          NOTARY_PROFILE: sibdocks-notary
          REQUIRE_NOTARIZATION: "1"
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          ./Scripts/package-release.sh "$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          gh release create "v$VERSION" \
            "dist/SibDocks-$VERSION.zip" \
            "dist/SibDocks-$VERSION.zip.sha256" \
            --generate-notes --verify-tag

      - name: Sync cask to the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          git fetch origin "$DEFAULT_BRANCH"
          git switch -C "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"
          ./Scripts/update-cask.sh "$VERSION"
          git add Casks/sibdocks.rb
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Update Homebrew cask to v$VERSION"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
